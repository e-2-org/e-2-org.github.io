<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}{% if page.section %} | {{ page.section }}{% endif %}{% if page.title %} | {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/e-2.css' | relative_url }}">
</head>

<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
{{ content }}
{% include footer.html %}
</body>

</html>
